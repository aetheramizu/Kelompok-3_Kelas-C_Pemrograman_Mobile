# Heap disesuaikan untuk mesin RAM 3GB. Template Flutter menulis -Xmx8G,
# yang membuat daemon Gradle crash "insufficient memory" saat build APK.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
